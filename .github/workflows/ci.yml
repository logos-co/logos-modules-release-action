name: CI

# Lints this action's own workflows + scripts so a regression is
# caught before the v1 tag is advanced (consumers pin @v1, so a bad
# push to the v1 line breaks every catalog at once).

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # actionlint also runs shellcheck on `run:` blocks when shellcheck
      # is on PATH (preinstalled on ubuntu-latest runners).
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: yamllint
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user yamllint
          "$(python3 -m site --user-base)/bin/yamllint" -s .

  # `python:` job removed when `scripts/build_index.py` left this repo
  # for `logos-co/logos-modules-release-tool` (its `index.py` now does
  # the indexing; this action workflow only invokes it). The new tool
  # repo owns its own Python tests; nothing python-shaped lives here
  # anymore to compile or unit-test.
