name: Rebuild index.json

# Reusable workflow that aggregates every per-module release into a single
# rolling `index.json` and uploads it to the `index` release tag.
#
# Triggered automatically by the `release.yml` workflow after a successful
# publication. Can also be invoked manually (workflow_dispatch) or on a
# schedule (catch-up after a missed dispatch).
#
# The index is built by `logos-co/logos-modules-release-tool`'s `index.py`
# — the single source of truth for the index.json format. The CI flow here
# collects every release's `.lgx` asset URL, hands them to `index.py build`,
# and uploads the result. Catalog maintainers running `index.py` locally
# produce byte-compatible output, so the GitHub-Actions path and the
# off-GitHub path stay in lockstep.

on:
  workflow_call:
  workflow_dispatch:
  repository_dispatch:
    types: [rebuild-index]
  schedule:
    - cron: '17 */6 * * *'   # every six hours; catches missed dispatches

# Serialize rebuilds per consumer repo. An umbrella "release all"
# fans out N per-module releases, each firing a `rebuild-index`
# repository_dispatch — without this they race to upload index.json
# to the `index` release and the last writer is nondeterministic.
# `index.py build` does a full rescan of every release each run, so a
# newer run strictly supersedes an in-flight one: cancel-in-progress
# coalesces the burst into one final, authoritative rebuild. (In a
# reusable workflow `github.repository` is the CALLER's repo, so the
# group is correctly per-catalog.)
concurrency:
  group: rebuild-index-${{ github.repository }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Caller-repo checkout. Two reasons:
      #   1. softprops/action-gh-release is friendlier when invoked from
      #      inside the caller's checkout.
      #   2. `index.py build` reads `./logos-repo.json` for the
      #      `repositoryName` field (falling back to "unknown") — same
      #      precedence the standalone CLI uses, so the workflow's index
      #      header matches what a maintainer would produce locally.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Bring `lgx` onto PATH. `index.py` requires it for the
      # verify/manifest/signature reads it does per package. Same
      # install pattern release.yml uses (DeterminateSystems' Nix
      # installer pinned to an immutable SHA, then a single
      # `nix build` against the package flake).
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Set up lgx CLI
        shell: bash
        run: |
          set -euo pipefail
          nix build github:logos-co/logos-package#lgx --out-link "$RUNNER_TEMP/lgx-tool"
          echo "$RUNNER_TEMP/lgx-tool/bin" >> "$GITHUB_PATH"

      # `index.py` lives in `logos-modules-release-tool`. Reusable
      # workflows don't get an automatic checkout of any other repo,
      # so we pull it explicitly and pin to `v1` (the same lockstep
      # convention `release.yml` used to pin its own scripts). Advance
      # both the v1 tag on the tool repo AND this rebuild-index.yml in
      # lockstep when the schema changes.
      #
      # NOT made configurable on purpose — same rationale the previous
      # in-tree builder had. An input would push version-coupling onto
      # every consumer; the v1 line is kept correct by advancing tag +
      # workflow together. v2 introduces its own rebuild-index.yml
      # hardcoded to `ref: v2`.
      - name: Checkout logos-modules-release-tool (for index.py)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: logos-co/logos-modules-release-tool
          ref: 520eb793c0dbad90b3dc490436a2d64f330f9e87
          path: _tool

      # Collect every published `.lgx` URL from the caller's releases.
      # We deliberately exclude the rolling `index` release (it carries
      # the catalog itself, not a module) and skip drafts (the index
      # mustn't advertise an unpublished version).
      #
      # `--paginate` walks every page; `gh api` honours $GH_TOKEN
      # automatically. The jq filter is byte-stable across re-runs
      # (relies only on draft + tag_name + browser_download_url), so
      # a fresh rebuild over an unchanged release set produces an
      # identical urls.txt.
      - name: Collect `.lgx` URLs from this repo's releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            "repos/${{ github.repository }}/releases" --paginate \
            --jq '
              .[]
              | select(.draft != true)
              | select(.tag_name != "index")
              | .assets[]?
              | select(.name | endswith(".lgx"))
              | .browser_download_url
            ' > urls.txt
          echo "::notice::collected $(wc -l < urls.txt) .lgx URL(s) from releases"

      - name: Build index.json
        shell: bash
        run: |
          set -euo pipefail
          # --icons-dir "" writes icon sidecars BESIDE index.json rather than
          # into an icons/ subdirectory. Release assets are a flat namespace —
          # a slash is not valid in an asset name — so the flat layout is what
          # this transport requires. `icon.path` in the index is resolved
          # relative to the index URL, so clients need no special handling.
          python3 _tool/index.py build urls.txt -o index.json --icons-dir ""
          # Small at-a-glance summary in the workflow log.
          jq '{ schemaVersion, repositoryName, packageCount: (.packages | length) }' index.json
          # find, not `ls | wc -l`: shellcheck SC2012/SC2035, and the
          # ./ prefix keeps a filename that starts with a dash from being
          # read as an option.
          echo "icon sidecars: $(find . -maxdepth 1 -name '*.png' | wc -l)"

      - name: Replace the `index` release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: index
          name:     Catalog index (auto-updated)
          body:     "Auto-generated index of every per-module release in this repository."
          # Icons are content-addressed (<sha256>.png), so re-uploading an
          # unchanged one is byte-identical and the action replaces in place.
          # A glob is used rather than a list because the set changes as
          # modules publish or update artwork.
          files: |
            index.json
            *.png
          # `softprops/action-gh-release` updates existing releases with the
          # same tag, replacing assets in-place. No manual delete needed.
