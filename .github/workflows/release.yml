name: Release module

# Reusable workflow that publishes a single Logos module as a per-module
# GitHub release plus a JSON sidecar that the rebuild-index workflow
# aggregates into the rolling `index` release.
#
# Source of truth for the module's name+version is `<module_path>/metadata.json`.
# There is intentionally no `module_name` / `version` input here; the action
# extracts both from the built artifact via `lgx manifest --json` and
# cross-checks them against `metadata.json` to fail loudly on drift.
#
# Signing is opt-in via `signing_mode`:
#   - none      (default) — produce an unsigned `.lgx`.
#   - inline    — `lgx sign` inside the workflow using the `signing_key` secret.
#   - external  — invoke `signing_command` with `LGX_PATH` pointing at the
#                 freshly-built unsigned `.lgx`. The command is responsible
#                 for producing a signed `.lgx` (either by replacing the
#                 file in-place or by writing it to `$LGX_SIGNED_OUT`).
#                 Suitable for HSM, Jenkins, hardware-token, and other
#                 signing rigs that must not see the key.

on:
  workflow_call:
    inputs:
      module_path:
        description: "Path to the module source within the caller repo."
        type: string
        default: "."
      variants:
        description: "Comma-separated list of variants to build."
        type: string
        # darwin-arm64 + linux-amd64 + linux-arm64 covers every GitHub-
        # hosted runner family currently available for public repos.
        # macOS Intel and Windows are not in the default set — callers
        # that need them can pass an explicit `variants:` list.
        default: "darwin-arm64,linux-amd64,linux-arm64"
      signing_mode:
        description: "One of: none, inline, external."
        type: string
        default: "none"
      signing_command:
        description: |
          Shell command (signing_mode=external). Run as
          `bash -c "$SIGNING_COMMAND"` — passed through the environment,
          NOT interpolated into the workflow body, so single/double
          quotes inside it are safe and need no escaping. Receives
          `LGX_PATH` (unsigned input) and `LGX_SIGNED_OUT`; must, on
          success, either modify $LGX_PATH in place or write the signed
          package to $LGX_SIGNED_OUT.
        type: string
        default: ""
      signing_command_image:
        description: |
          Docker image to execute `signing_command` in (signing_mode=external).
          Empty means run on the runner directly.
        type: string
        default: ""
      skip_if_published:
        description: |
          When true (default), skip the build + release if a release
          tagged `<module>-v<version>` already exists in the caller
          repo AND carries both a `.lgx` and a `sidecar.json` asset
          (i.e. it will already be — or already is — in the index).
          A half-published release missing either asset is NOT skipped
          so it can self-heal. Set false to force a rebuild/republish
          of the same version — its assets are overwritten and its tag is
          re-pointed at the commit that rebuilt them.
        type: boolean
        default: true
    secrets:
      signing_key:
        description: |
          JWK-format Ed25519 secret key. Required iff signing_mode == inline.
        required: false

jobs:
  setup:
    runs-on: ubuntu-latest
    # Reading the caller's releases (public repos need no auth, but be
    # explicit so private catalogs work too).
    permissions:
      contents: read
    outputs:
      module_name:       ${{ steps.meta.outputs.module_name }}
      version:           ${{ steps.meta.outputs.version }}
      variants:          ${{ steps.meta.outputs.variants }}
      already_published: ${{ steps.published.outputs.already_published }}
    steps:
      # fetch-depth: 0 produces a full (non-shallow) clone. Required
      # because module flake.nix files use `git+file://…` flake inputs
      # pointing at the submodule, and Nix rejects shallow flake
      # inputs unless `shallow = true;` is specified in the URL —
      # which we can't control from inside the action. Cloning fully
      # is the path of least surprise.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
      - id: meta
        name: Read metadata.json
        shell: bash
        run: |
          set -euo pipefail

          # ── Fail fast on invalid inputs ──────────────────────────────
          # Without this an unrecognised signing_mode (e.g. "Inline",
          # "sign") silently produces an UNSIGNED release — both the
          # inline and external steps are `if:`-gated on exact strings,
          # so a typo means "no signing" with no error. That's a
          # correctness/security footgun; reject it here instead.
          case "${{ inputs.signing_mode }}" in
            none|inline|external) ;;
            *)
              echo "::error::invalid signing_mode '${{ inputs.signing_mode }}' (expected: none, inline, external)"
              exit 1
              ;;
          esac
          if [[ "${{ inputs.signing_mode }}" == "external" && -z "${{ inputs.signing_command }}" ]]; then
            echo "::error::signing_mode=external requires a non-empty signing_command"
            exit 1
          fi

          mpath="${{ inputs.module_path }}"
          if [[ ! -f "$mpath/metadata.json" ]]; then
            echo "::error::no metadata.json at $mpath"; exit 1
          fi
          name=$(jq -r '.name'    "$mpath/metadata.json")
          ver=$(jq  -r '.version' "$mpath/metadata.json")
          if [[ -z "$name" || "$name" == "null" ]]; then echo "::error::metadata.json missing name"; exit 1; fi
          if [[ -z "$ver"  || "$ver"  == "null" ]]; then echo "::error::metadata.json missing version"; exit 1; fi
          echo "module_name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$ver"      >> "$GITHUB_OUTPUT"
          # JSON array form for matrix consumption. Drop blank tokens
          # (trailing comma, "a,,b", all-whitespace) so a malformed or
          # empty `variants` input fails here rather than producing a
          # matrix with an empty/garbage variant that fails opaquely in
          # the build job.
          IFS=',' read -ra V <<< "${{ inputs.variants }}" || true
          arr="["
          # "${V[@]:-}" — empty/unset array is safe under `set -u`
          # (bash 3.2+); the empty token is skipped by the guard below
          # and an all-empty input falls through to the [] check.
          for v in "${V[@]:-}"; do
            t="${v//[[:space:]]/}"
            [[ -z "$t" ]] && continue
            arr+="\"$t\","
          done
          arr="${arr%,}]"
          if [[ "$arr" == "[]" ]]; then
            echo "::error::variants input parsed to an empty list (got: '${{ inputs.variants }}')"
            exit 1
          fi
          echo "variants=$arr" >> "$GITHUB_OUTPUT"

      - id: published
        name: Check if this version is already published
        # Skip the (expensive) Nix build when `<module>-v<version>` is
        # already a release carrying both a `.lgx` and a `sidecar.json`
        # — i.e. it is, or will be on the next index rebuild, in the
        # catalog. The release (not index.json) is the source of truth:
        # the index is derived from releases and is eventually
        # consistent, so a release that fully exists is the correct,
        # race-free gate. A release missing either asset is treated as
        # NOT published so a half-finished prior run self-heals.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.skip_if_published }}" != "true" ]]; then
            echo "skip_if_published=false — will build/republish regardless"
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${{ steps.meta.outputs.module_name }}-v${{ steps.meta.outputs.version }}"
          if rel=$(gh api "repos/${GH_REPO}/releases/tags/${tag}" 2>/dev/null); then
            has_lgx=$(jq '[.assets[]?.name | select(endswith(".lgx"))] | length' <<<"$rel")
            has_side=$(jq '[.assets[]?.name | select(. == "sidecar.json")] | length' <<<"$rel")
            if [[ "${has_lgx:-0}" -gt 0 && "${has_side:-0}" -gt 0 ]]; then
              echo "::notice::${tag} already published (.lgx + sidecar present) — skipping build"
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::${tag} release exists but is missing assets — rebuilding to heal"
          else
            echo "${tag} not yet published — building"
          fi
          echo "already_published=false" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    if: needs.setup.outputs.already_published != 'true'
    strategy:
      # Not every module's flake.nix defines outputs for every variant
      # — e.g. some modules pre-date the linux-arm64 default and only
      # expose darwin-arm64 + linux-amd64. Let those variants fail
      # individually without aborting the run; the release job below
      # merges whatever variants succeeded and surfaces a partial
      # release rather than dropping the whole module.
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.setup.outputs.variants) }}
        include:
          - variant: darwin-arm64
            runs-on: macos-latest          # Apple silicon
          - variant: linux-amd64
            runs-on: ubuntu-latest         # x86_64
          - variant: linux-arm64
            runs-on: ubuntu-24.04-arm      # Public GitHub arm64 runner (GA'd 2025)
    runs-on: ${{ matrix.runs-on }}
    steps:
      # Same full-clone rationale as the setup job: Nix flake inputs
      # that reference the local working tree refuse to consume a
      # shallow clone.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
      # DeterminateSystems' installer rather than cachix/install-nix-action@v25,
      # which trips over the macos-latest runner's pre-provisioned _nixbld*
      # users (`<dscl_cmd> DS Error: -14135 (eDSRecordAlreadyExists)`).
      # DS detects pre-existing Nix installs and skips the user-creation
      # step gracefully on all current GitHub runners (Apple silicon
      # macOS, ubuntu-latest, ubuntu-24.04-arm).
      # Pinned to an immutable release SHA (was @main — a moving ref, a
      # supply-chain + reproducibility risk). Bump deliberately; CI's
      # actionlint + Dependabot (.github/dependabot.yml) surface updates.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Build .lgx (${{ matrix.variant }})
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ inputs.module_path }}"
          # Build the PORTABLE bundle (`.#lgx-portable`), not the dev one
          # (`.#lgx`). The dev bundle uses /nix/store paths and tags
          # variants with a "-dev" suffix (e.g. linux-amd64-dev). End
          # users running a non-dev basecamp have validVariants without
          # that suffix, so dev-tagged variants get rejected by the UI
          # as "Not Available" / BuildFlavorMismatch. The portable
          # bundle is self-contained and uses the canonical variant
          # names that match what the package manager expects.
          nix build .#lgx-portable --print-out-paths --no-link > .lgx-out
          # The lgx build output is a single .lgx file in the result dir.
          out=$(cat .lgx-out)
          lgx=$(find "$out" -maxdepth 2 -name '*.lgx' | head -n1)
          if [[ -z "$lgx" ]]; then echo "::error::nix build produced no .lgx"; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/_artifacts"
          cp "$lgx" "$GITHUB_WORKSPACE/_artifacts/${{ needs.setup.outputs.module_name }}-${{ matrix.variant }}.lgx"
      # Artifact name MUST include the module name. The umbrella
      # `Release all modules` workflow fans out a matrix over every
      # submodule, and all 13 module pipelines run inside one shared
      # workflow run — `actions/upload-artifact@v4` rejects two uploads
      # with the same name in the same run (HTTP 409 Conflict).
      # `<module>-<variant>` keeps names unique across the umbrella
      # while the per-module standalone workflow still produces a
      # well-formed artifact set.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lgx-${{ needs.setup.outputs.module_name }}-${{ matrix.variant }}
          path: _artifacts/*.lgx

  release:
    needs: [setup, build]
    # `if: always()` lets us release when SOME variants succeeded but
    # others failed (e.g. linux-arm64 missing from a module's flake.nix).
    # We still gate on `setup` having produced module_name + version —
    # without those the rest of the job has nothing to do. The merge
    # step below errors when zero variants downloaded, so a total
    # build wipeout still fails the run loudly. `already_published`
    # short-circuits the whole pipeline (build was skipped too).
    if: >-
      always()
      && needs.setup.result == 'success'
      && needs.setup.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Same DeterminateSystems-installer rationale as the build job —
      # avoids the macOS runner's eDSRecordAlreadyExists issue.
      # Pinned to an immutable release SHA (was @main — a moving ref, a
      # supply-chain + reproducibility risk). Bump deliberately; CI's
      # actionlint + Dependabot (.github/dependabot.yml) surface updates.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # Bring `lgx` (from logos-co/logos-package) onto PATH so the
      # downstream merge / verify / sign / manifest steps can use a
      # plain `lgx ...` invocation instead of repeating
      # `nix run github:logos-co/logos-package#lgx --` four times.
      # `lgx` is NOT in nixpkgs (the previous `nix run nixpkgs#lgx`
      # was wrong and produced the "flake nixpkgs does not provide
      # attribute lgx" error).
      - name: Set up lgx CLI
        shell: bash
        run: |
          set -euo pipefail
          nix build github:logos-co/logos-package#lgx --out-link "$RUNNER_TEMP/lgx-tool"
          echo "$RUNNER_TEMP/lgx-tool/bin" >> "$GITHUB_PATH"

      # Pattern must scope to THIS module only — the umbrella workflow
      # run hosts uploads from every other module too (lgx-<other>-*).
      # Without the module-name prefix the merge step would pull all
      # of them and `lgx merge` would fail on the mismatched manifests.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: _per-variant
          pattern: lgx-${{ needs.setup.outputs.module_name }}-*

      - name: Merge per-variant .lgx files
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          # `find` (not a shell glob) so an empty match yields zero
          # array entries rather than the literal pattern string.
          # `mapfile` on an unset/nullglob expansion would otherwise
          # report ${#variants[@]} == 1 and we'd treat "no variants"
          # as "one variant" further down.
          mapfile -t variants < <(find _per-variant -type f -name '*.lgx' 2>/dev/null || true)
          name="${{ needs.setup.outputs.module_name }}"
          ver="${{ needs.setup.outputs.version }}"
          out="$GITHUB_WORKSPACE/${name}-${ver}.lgx"

          case ${#variants[@]} in
            0)
              # All variants failed. Nothing to publish; surface the
              # situation as a workflow error so the run is visibly
              # failed rather than silently shipping a no-op.
              echo "::error::no variants downloaded — every build job failed for this module"
              exit 1
              ;;
            1)
              # Exactly one variant succeeded — `lgx merge` requires two
              # or more inputs, so use the single-variant file as the
              # release artifact directly. Common path for modules that
              # don't (yet) define all platforms in their flake.nix
              # (e.g. missing aarch64-linux output).
              echo "::notice::only one variant built (${variants[0]}); skipping merge"
              cp "${variants[0]}" "$out"
              ;;
            *)
              lgx merge "${variants[@]}" -o "$out" -y
              ;;
          esac
          echo "lgx=$out" >> "$GITHUB_OUTPUT"

          # Which variants actually made it into this release. Artifact
          # files are named "<module>-<variant>.lgx" (see the build
          # job's cp). The module name is known exactly, so stripping
          # the "<name>-" prefix + ".lgx" suffix yields the variant even
          # though both names contain dashes. Emitted as a sorted,
          # comma-separated list for the sidecar / release-notes steps.
          built=()
          for f in "${variants[@]}"; do
            b="$(basename "$f" .lgx)"   # <name>-<variant>
            built+=("${b#"${name}-"}")
          done
          built_csv="$(printf '%s\n' "${built[@]}" | sort -u | paste -sd, -)"
          echo "built=$built_csv" >> "$GITHUB_OUTPUT"

      - name: Verify merged package (pre-sign)
        run: lgx verify "${{ steps.merge.outputs.lgx }}"

      - name: Sign (inline)
        if: inputs.signing_mode == 'inline'
        env:
          SIGNING_KEY: ${{ secrets.signing_key }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEY:-}" ]]; then
            echo "::error::signing_mode=inline but signing_key secret is empty"; exit 1
          fi
          tmpd=$(mktemp -d)
          printf '%s' "$SIGNING_KEY" > "$tmpd/release.jwk"
          chmod 600 "$tmpd/release.jwk"
          lgx sign "${{ steps.merge.outputs.lgx }}" --key release --keys-dir "$tmpd"
          lgx verify "${{ steps.merge.outputs.lgx }}"

      - name: Sign (external)
        if: inputs.signing_mode == 'external'
        shell: bash
        env:
          LGX_PATH: ${{ steps.merge.outputs.lgx }}
          # Caller-supplied values reach the script through the
          # environment, never via `${{ … }}` interpolated into the
          # run body. `bash -c '${{ inputs.signing_command }}'`
          # substitutes at YAML-render time: a command containing a
          # single quote breaks the script, and arbitrary text rendered
          # into shell is a script-injection seam. As env vars they
          # arrive at bash verbatim, as a single argv element.
          SIGNING_COMMAND: ${{ inputs.signing_command }}
          SIGNING_COMMAND_IMAGE: ${{ inputs.signing_command_image }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_COMMAND:-}" ]]; then
            echo "::error::signing_mode=external requires signing_command"; exit 1
          fi
          export LGX_SIGNED_OUT="${LGX_PATH%.lgx}.signed.lgx"
          if [[ -n "${SIGNING_COMMAND_IMAGE:-}" ]]; then
            docker run --rm \
              -v "$PWD:/work" -w /work \
              -e LGX_PATH="$LGX_PATH" -e LGX_SIGNED_OUT="$LGX_SIGNED_OUT" \
              "$SIGNING_COMMAND_IMAGE" \
              bash -c "$SIGNING_COMMAND"
          else
            bash -c "$SIGNING_COMMAND"
          fi
          if [[ -f "$LGX_SIGNED_OUT" ]]; then mv "$LGX_SIGNED_OUT" "$LGX_PATH"; fi
          lgx verify "$LGX_PATH"

      - name: Extract manifest & build sidecar JSON
        id: sidecar
        shell: bash
        run: |
          set -euo pipefail
          lgx="${{ steps.merge.outputs.lgx }}"
          manifest=$(lgx manifest "$lgx" --json)
          mname=$(jq -r .name    <<<"$manifest")
          mver=$(jq  -r .version <<<"$manifest")
          mroot=$(jq -r '.hashes.root // ""' <<<"$manifest")
          if [[ "$mname" != "${{ needs.setup.outputs.module_name }}" || "$mver" != "${{ needs.setup.outputs.version }}" ]]; then
            echo "::error::manifest mismatch — metadata.json says ${{ needs.setup.outputs.module_name }}@${{ needs.setup.outputs.version }} but .lgx has $mname@$mver"
            exit 1
          fi
          sha=$(sha256sum "$lgx" | awk '{print $1}')
          size=$(stat -c%s "$lgx" 2>/dev/null || stat -f%z "$lgx")
          sig=""
          if unzip -p "$lgx" manifest.sig 2>/dev/null | head -c1 >/dev/null; then
            # `.lgx` is gzip-tar, not zip; use tar to peek instead.
            sig=$(tar -O -xzf "$lgx" manifest.sig 2>/dev/null || true)
          fi
          # Partial-variant visibility: which variants were requested
          # (setup output) vs actually built (merge output). The build
          # matrix uses fail-fast:false, so a release can legitimately
          # ship fewer variants than requested — record exactly which,
          # so operators and clients don't have to diff release assets
          # by hand. Additive sidecar fields; schemaVersion is unchanged
          # and consumers that ignore unknown keys are unaffected.
          requested_json='${{ needs.setup.outputs.variants }}'
          built_json=$(printf '%s' '${{ steps.merge.outputs.built }}' \
                       | jq -R 'split(",") | map(select(length>0))')
          missing_json=$(jq -cn --argjson r "$requested_json" --argjson b "$built_json" '$r - $b')

          jq -n \
             --arg releaseTag "${{ needs.setup.outputs.module_name }}-v${{ needs.setup.outputs.version }}" \
             --arg releasedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg sha "$sha" --argjson size "$size" \
             --arg rootHash "$mroot" \
             --argjson manifest "$manifest" \
             --arg signature "$sig" \
             --argjson builtVariants "$built_json" \
             --argjson missingVariants "$missing_json" \
             '{
                publisherRef:    $releaseTag,
                releasedAt:      $releasedAt,
                sha256:          $sha,
                size:            $size,
                rootHash:        $rootHash,
                builtVariants:   $builtVariants,
                missingVariants: $missingVariants,
                manifest:        $manifest
              } + (if ($signature | length) > 0
                   then { signature: ($signature | fromjson) }
                   else {} end)' > sidecar.json
          echo "lgx=$lgx" >> "$GITHUB_OUTPUT"
          echo "sidecar=$PWD/sidecar.json" >> "$GITHUB_OUTPUT"

          # Human-readable release body (the rebuild-index step reads
          # the sidecar, not this — this is purely for the GitHub UI).
          built_list=$(jq -r 'join(", ")' <<<"$built_json")
          missing_list=$(jq -r 'if length>0 then join(", ") else "—" end' <<<"$missing_json")
          {
            echo 'notes<<__NOTES_EOF__'
            echo "Built variants: ${built_list}"
            echo "Missing variants: ${missing_list}"
            if [[ "$missing_list" != "—" ]]; then
              echo
              echo "_Partial release — some requested variants did not build._"
            fi
            echo '__NOTES_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.setup.outputs.module_name }}-v${{ needs.setup.outputs.version }}
          name:     ${{ needs.setup.outputs.module_name }} v${{ needs.setup.outputs.version }}
          body:     ${{ steps.sidecar.outputs.notes }}
          files: |
            ${{ steps.sidecar.outputs.lgx }}
            ${{ steps.sidecar.outputs.sidecar }}

      # On a forced republish (skip_if_published=false) the step above
      # rebuilds the release in place, but a pre-existing tag still points
      # at the OLD commit — e.g. the submodule pointer moved while
      # metadata.json#version stayed the same. Move the tag onto the commit
      # that actually built the published .lgx so tag and artifact agree.
      #
      # Guarded to a no-op on the normal new-version path (the tag is
      # already here, so nothing is pushed). A protected tag that refuses
      # the move only warns — the package itself is already published, the
      # tag's commit pointer is cosmetic. Uses the checkout's authenticated
      # `origin`, so it also works for private catalogs. Lightweight tag,
      # so no committer identity is needed.
      - name: Re-point tag at the built commit
        if: success()
        shell: bash
        env:
          TAG: ${{ needs.setup.outputs.module_name }}-v${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/tags/${TAG}" | awk 'NR==1{print $1}')"
          if [[ "${current}" == "${GITHUB_SHA}" ]]; then
            echo "tag ${TAG} already at ${GITHUB_SHA} — nothing to move"
            exit 0
          fi
          echo "moving tag ${TAG}: ${current:-<none>} -> ${GITHUB_SHA}"
          if git tag -f "${TAG}" "${GITHUB_SHA}" \
             && git push -f origin "refs/tags/${TAG}"; then
            echo "::notice::re-pointed ${TAG} at ${GITHUB_SHA}"
          else
            echo "::warning::could not move tag ${TAG} (protected?); the release assets were still updated"
          fi

      - name: Trigger rebuild-index workflow
        if: success()
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          event-type: rebuild-index

  # Runs only on the skip path. The build/release jobs are gated off,
  # so this is where we (cheaply) nudge the index in case a prior run
  # published the release but its rebuild-index never landed — the
  # 6-hourly schedule would eventually catch it, but a dispatch here
  # makes "already published" promptly imply "in the index".
  already-published:
    needs: setup
    if: needs.setup.outputs.already_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Summarise skip
        run: |
          echo "::notice::Skipped build/release — ${{ needs.setup.outputs.module_name }}-v${{ needs.setup.outputs.version }} is already published. Nudging rebuild-index."
      - name: Trigger rebuild-index workflow
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          event-type: rebuild-index
